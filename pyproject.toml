[project]
name = "hynet"
version = "0.1.0"
description = "HY-Net: Harmonized Asymmetric Gated Y-Net for organoid segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pytorch-msssim",
    "scikit-image",
    "scipy",
    "tqdm",
]

# PyTorch is installed through an extra so that the right build (CPU / CUDA) is chosen:
#   uv sync --extra cu128   # NVIDIA GPU
#   uv sync --extra cpu     # CPU only
[project.optional-dependencies]
cpu = ["torch>=2.4", "torchvision"]
cu128 = ["torch>=2.4", "torchvision"]

[project.scripts]
hynet-train = "hynet.cli.train:main"
hynet-test = "hynet.cli.test:main"
hynet-predict = "hynet.cli.predict:main"
hynet-evaluate = "hynet.cli.evaluate:main"
hynet-make-folds = "hynet.cli.make_folds:main"
hynet-compare = "hynet.cli.compare:main"
hynet-benchmark = "hynet.cli.benchmark:main"
hynet-prepare-external = "hynet.cli.prepare_external:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hynet"]

[tool.uv]
link-mode = "copy"
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
